definitions:
  models.Error:
    properties:
      message:
        type: string
    type: object
  models.Link:
    properties:
      id:
        type: string
      link:
        type: string
      name:
        type: string
      visits:
        type: integer
    type: object
  models.Linktree:
    properties:
      bio:
        type: string
      fullname:
        type: string
      id:
        type: string
      links:
        items:
          $ref: '#/definitions/models.Link'
        type: array
    type: object
  models.User:
    properties:
      email:
        type: string
      id:
        type: string
      linkTreeID:
        type: string
      password:
        type: string
      token:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /linktree/:
    post:
      consumes:
      - application/json
      parameters:
      - description: add a new linktree
        in: body
        name: linktree
        required: true
        schema:
          $ref: '#/definitions/models.Linktree'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Linktree'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - token: []
      summary: add a new linktree to a user
  /linktree/{id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: linktree id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Linktree'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Error'
      summary: get a new linktree by ID
  /linktree/{id}/addbio:
    put:
      consumes:
      - application/json
      parameters:
      - description: linktree id
        in: path
        name: id
        required: true
        type: string
      - description: bio
        in: body
        name: bio
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Linktree'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - token: []
      summary: add bio to linktree
  /linktree/{id}/addfullname:
    put:
      consumes:
      - application/json
      parameters:
      - description: linktree id
        in: path
        name: id
        required: true
        type: string
      - description: fullname
        in: body
        name: fullname
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Linktree'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - token: []
      summary: add fullname to linktree
  /linktree/{id}/addlink:
    put:
      consumes:
      - application/json
      parameters:
      - description: linktree id
        in: path
        name: id
        required: true
        type: string
      - description: link
        in: body
        name: link
        required: true
        schema:
          $ref: '#/definitions/models.Link'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Linktree'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - token: []
      summary: add link to linktree
  /linktree/{id}/addvisit:
    put:
      parameters:
      - description: tree id
        in: path
        name: id
        required: true
        type: string
      - description: link id
        in: header
        name: link_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Linktree'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Error'
      summary: update visits count for a link
  /linktree/{id}/deletelink:
    delete:
      consumes:
      - application/json
      parameters:
      - description: linktree id
        in: path
        name: id
        required: true
        type: string
      - description: link
        in: body
        name: link
        required: true
        schema:
          $ref: '#/definitions/models.Link'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Linktree'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - token: []
      summary: delete link in linktree
  /linktree/{id}/updatelink:
    put:
      consumes:
      - application/json
      parameters:
      - description: linktree id
        in: path
        name: id
        required: true
        type: string
      - description: link
        in: body
        name: link
        required: true
        schema:
          $ref: '#/definitions/models.Link'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Linktree'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Error'
      security:
      - token: []
      summary: update link in linktree
  /linktree/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: login a user
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Error'
      summary: login a user
  /linktree/signup:
    post:
      consumes:
      - application/json
      parameters:
      - description: Signup a new user
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Error'
      summary: signup a new user
securityDefinitions:
  token:
    in: header
    name: token
    type: apiKey
swagger: "2.0"
